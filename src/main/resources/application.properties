spring.application.name=githubresumer
#test
#second test
#third test
# Carica i segreti reali da application-local.properties (git-ignored). Vedi application-local.properties.template.
spring.profiles.include=local

# --- Database (MySQL) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/githubresumer?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# --- Webhook: serve il body grezzo per verificare la firma HMAC ---
# (nessuna proprietà extra; il controller legge byte[] direttamente)

# --- Anthropic (Claude) ---
anthropic.model=claude-haiku-4-5-20251001
anthropic.version=2023-06-01
anthropic.max-tokens=256

# --- Firebase / FCM ---
# enabled=false => le notifiche vengono solo loggate (utile finché non configuri Firebase)
firebase.enabled=false

# --- Sessione: access token (JWT breve) + refresh token (lungo, revocabile) ---
app.jwt.access-token-minutes=15
app.refresh-token.ttl-days=60

# --- Codice OAuth usa-e-getta (scambiato dall'app via POST /auth/exchange) ---
app.auth-code.ttl-seconds=120

# --- Cifratura token GitHub a riposo (AES-256-GCM) ---
# Genera la chiave con: openssl rand -base64 32
app.encryption.secret-key=${ENCRYPTION_SECRET_KEY:}
