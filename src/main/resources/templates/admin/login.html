<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin · GitHub Resumer</title>
    <style>
        :root {
            --canvas: #0d1117; --elevated: #161b22; --border: #30363d;
            --green: #238636; --green-hover: #2ea043;
            --text: #e6edf3; --muted: #8b949e; --danger: #f85149;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(180deg, var(--canvas), var(--elevated));
            color: var(--text); font-family: -apple-system, Segoe UI, Roboto, sans-serif;
        }
        .card {
            background: var(--elevated); border: 1px solid var(--border); border-radius: 14px;
            padding: 40px; width: 360px; max-width: 90vw; text-align: center;
        }
        h1 { font-size: 20px; margin: 0 0 4px; }
        .sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
        .btn {
            display: inline-block; width: 100%; padding: 14px; border-radius: 10px;
            background: var(--green); color: #fff; text-decoration: none; font-weight: 600;
        }
        .btn:hover { background: var(--green-hover); }
        .err {
            background: rgba(248,81,73,.12); border: 1px solid var(--danger); color: var(--danger);
            border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>GitHub Resumer</h1>
        <p class="sub">Pannello di amministrazione</p>

        <p class="err" th:if="${error == 'forbidden'}">
            Questo account non ha i permessi di amministratore.
        </p>
        <p class="err" th:if="${error == 'auth'}">
            Login non riuscito. Riprova.
        </p>

        <a class="btn" href="/admin/oauth/start">Login con GitHub</a>
    </div>
</body>
</html>
