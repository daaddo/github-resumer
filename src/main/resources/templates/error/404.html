<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Niente trovato · GitHub Resumer</title>
    <style>
        :root {
            --canvas: #0d1117; --elevated: #161b22; --border: #30363d;
            --green: #238636; --green-hover: #2ea043;
            --text: #e6edf3; --muted: #8b949e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(180deg, var(--canvas), var(--elevated));
            color: var(--text); font-family: -apple-system, Segoe UI, Roboto, sans-serif;
        }
        .card {
            background: var(--elevated); border: 1px solid var(--border); border-radius: 14px;
            padding: 40px; width: 360px; max-width: 90vw; text-align: center;
        }
        .code { font-size: 56px; font-weight: 700; margin: 0; line-height: 1; }
        h1 { font-size: 20px; margin: 12px 0 4px; }
        .sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
        .btn {
            display: inline-block; width: 100%; padding: 14px; border-radius: 10px;
            background: var(--green); color: #fff; text-decoration: none; font-weight: 600;
        }
        .btn:hover { background: var(--green-hover); }
    </style>
</head>
<body>
    <div class="card">
        <p class="code">404</p>
        <h1>Niente trovato</h1>
        <p class="sub">La pagina che cerchi non esiste o è stata spostata.</p>

        <a class="btn" href="/admin">Vai alla dashboard admin</a>
    </div>
</body>
</html>
