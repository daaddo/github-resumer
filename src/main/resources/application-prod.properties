# =============================================================================
#  Profilo di PRODUZIONE.
#  Attivalo con  SPRING_PROFILES_ACTIVE=prod  (gia impostato nell'immagine Docker).
#  Tutti i segreti arrivano da VARIABILI D'AMBIENTE: niente valori in chiaro nel jar.
#  Le variabili senza default (es. ${APP_JWT_SECRET}) sono OBBLIGATORIE: se mancano
#  l'app non parte (fail-fast), cosi non si va mai in produzione mal configurati.
# =============================================================================

# --- Database (MySQL) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# --- GitHub App + OAuth ---
github.app-id=${GITHUB_APP_ID}
github.client-id=${GITHUB_CLIENT_ID}
github.client-secret=${GITHUB_CLIENT_SECRET}
github.webhook-secret=${GITHUB_WEBHOOK_SECRET}
# Chiave privata PKCS#8 su una riga, con \n al posto degli a-capo (il parser li normalizza).
github.private-key=${GITHUB_PRIVATE_KEY}
github.callback-base-url=${GITHUB_CALLBACK_BASE_URL}
github.app-redirect-uri=${GITHUB_APP_REDIRECT_URI}

# --- Anthropic (Claude) ---
anthropic.api-key=${ANTHROPIC_API_KEY}
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
anthropic.version=${ANTHROPIC_VERSION:2023-06-01}
anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:256}

# --- Firebase / FCM ---
firebase.enabled=${FIREBASE_ENABLED:true}
# Monta il service account come file e punta qui (es. secret di Docker/K8s).
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:file:/run/secrets/firebase-service-account.json}

# --- Sessione: access token (JWT breve) + refresh token (lungo, revocabile) ---
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-minutes=${APP_JWT_ACCESS_TOKEN_MINUTES:15}
app.refresh-token.ttl-days=${APP_REFRESH_TOKEN_TTL_DAYS:60}
app.auth-code.ttl-seconds=${APP_AUTH_CODE_TTL_SECONDS:120}

# --- Server / logging ---
server.port=${SERVER_PORT:8080}
logging.level.root=${LOG_LEVEL:INFO}
